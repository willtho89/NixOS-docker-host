services:
  nzbhydra2:
    image: ghcr.io/hotio/nzbhydra2:latest
    container_name: nzbhydra2
    restart: unless-stopped
    expose:
      - 5076
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ:-UTC} 
    volumes:
      - ${DOCKER_DATA_DIR}/nzbhydra:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nzbhydra2-api.rule=Host(`${NZBHYDRA2_HOSTNAME?}`) && QueryRegexp(`apikey`, `.+`)"
      - "traefik.http.routers.nzbhydra2-api.entrypoints=websecure"
      - "traefik.http.routers.nzbhydra2-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nzbhydra2-api.priority=100"
      - "traefik.http.routers.nzbhydra2.rule=Host(`${NZBHYDRA2_HOSTNAME?}`)"
      - "traefik.http.routers.nzbhydra2.entrypoints=websecure"
      - "traefik.http.routers.nzbhydra2.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nzbhydra2.middlewares=authelia@docker"
      - "traefik.http.routers.nzbhydra2.priority=100"
