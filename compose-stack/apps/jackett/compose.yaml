services:
  jackett:
    image: linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ:-UTC}  
    expose:
      - 9117
    volumes:
      - ${DOCKER_DATA_DIR}/jackett:/config
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
    
      # 1) Bypass-Router für API-Aufrufe mit apikey
      - "traefik.http.routers.jackett-api.rule=Host(`${JACKETT_HOSTNAME?}`) && QueryRegexp(`apikey`, `.+`)"
      - "traefik.http.routers.jackett-api.entrypoints=websecure"
      - "traefik.http.routers.jackett-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.jackett-api.priority=100"
    
      # 2) Normaler Router mit Authelia
      - "traefik.http.routers.jackett.rule=Host(`${JACKETT_HOSTNAME?}`)"
      - "traefik.http.routers.jackett.entrypoints=websecure"
      - "traefik.http.routers.jackett.tls.certresolver=letsencrypt"
      - "traefik.http.routers.jackett.middlewares=authelia@docker"
      - "traefik.http.routers.jackett.priority=10"

    healthcheck:
      test: curl -f http://localhost:9117/health 
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
